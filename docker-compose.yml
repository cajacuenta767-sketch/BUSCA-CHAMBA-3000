services:
  # Interfaz web oficial del scraper (opción A del README)
  gmaps-scraper:
    image: gosom/google-maps-scraper:latest
    container_name: gmaps-scraper
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gmapsdata:/gmapsdata
    command: ["-data-folder", "/gmapsdata"]

  # Panel de leads + orquestador por cuadrícula (node server.js)
  # Lanza el scraper con `docker run` (SCRAPER_MODE=docker), por eso monta el socket de Docker.
  panel:
    build: .
    container_name: busca-chamba-panel
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - SCRAPER_MODE=docker
      - DB_DRIVER=auto
      # - BASIC_AUTH=usuario:clave
      # - PROXIES=http://user:pass@ip:port
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
