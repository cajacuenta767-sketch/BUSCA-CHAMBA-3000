name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
      - name: Arranque en frío (JSON y SQLite)
        run: |
          for drv in json sqlite; do
            DB_DRIVER=$drv PORT=8099 DATA_DIR=/tmp/bc-$drv node server.js & pid=$!
            sleep 2
            curl -fsS http://127.0.0.1:8099/api/health
            kill $pid
          done
